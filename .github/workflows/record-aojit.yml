name: Record AOJIT images

# Records OpenMinis AOJIT images on a GitHub-hosted arm64 macOS runner.
# Free and unlimited for public repositories.
#
# Pipeline (verified against OpenMinis 1.15, deps/ish @0fd17a1):
#   JIT CLI ish -> Alpine 3.21 fakefs rootfs -> apk packages -> suite -> record -> .S/.o
#
# The images are tied to (a) the abi of the ish that recorded them and
# (b) each guest module's ELF build-id. Both are printed in the job summary.

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "OpenMinis tag/branch/commit to record against (1.15 -> abi 1f3bb5a0)"
        default: "1.15"
        required: true
      modules:
        description: "images.json keys, space separated"
        default: "musl busybox python"
        required: true
      jobs:
        description: "Parallel recordings (JOBS); 2 is safe on 7 GB"
        default: "2"
        required: true
      ios:
        description: "Also assemble the iOS .o objects"
        type: boolean
        default: true
      npm:
        description: "Install the npm packages the node workload starts (slow, only for node)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: aojit-record
  cancel-in-progress: false

jobs:
  record:
    # Apple Silicon. Must be macos-26 (Xcode 26 / iOS 26 SDK): the ish kernel
    # calls posix_spawn_file_actions_addchdir, which only the 26 SDK declares.
    # macos-15 (Xcode 16.4) fails with "call to undeclared function".
    runs-on: macos-26
    timeout-minutes: 350
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      JOBS: ${{ inputs.jobs }}
      IOS: ${{ inputs.ios && '1' || '0' }}
      MODULES: ${{ inputs.modules }}

    steps:
      - name: Show environment
        run: |
          uname -m
          uname -a
          echo "hostname: '$(uname -n)' -> $(uname -n | wc -c) bytes incl. newline"
          sw_vers
          xcodebuild -version
          df -h /

      - name: Assert Apple Silicon
        run: |
          if [ "$(uname -m)" != "arm64" ]; then
            echo "::error::Runner is $(uname -m); AOJIT images must be recorded on arm64."
            exit 1
          fi

      - name: Install build tools
        run: |
          # lld is required to compile the guest VDSO (-fuse-ld=lld).
          # Homebrew ships it as its own formula since llvm was split up.
          brew install meson ninja libarchive lld pkg-config
          command -v ld.lld
          ld.lld --version
          python3 -m pip install --user tqdm 2>/dev/null \
            || python3 -m pip install --user --break-system-packages tqdm

      - name: Clone OpenMinis at the pinned ref
        run: |
          git clone --depth 1 --branch "${{ inputs.ref }}" \
            --recurse-submodules --shallow-submodules \
            https://github.com/OpenMinis/OpenMinis.git src
          echo "--- submodule commits (store these next to the images) ---"
          git -C src submodule status

      - name: Patch kernel/uname.c (fortify-safe copies)
        working-directory: src/deps/ish
        run: |
          # do_uname() strcpy()s the host nodename into char hostname[65].
          # Under the 26 SDK the strcpy is fortify-checked, so any hostname
          # that does not fit (or an unset one, leaving stack garbage in
          # real_uname) aborts the whole ish process with
          # "HOST CRASH: signal 5 ... __chk_fail_overflow ... sys_uname".
          python3 - <<'PY'
          import pathlib, sys
          p = pathlib.Path("kernel/uname.c")
          s = p.read_text()
          subs = [
              ("    struct utsname real_uname;\n    uname(&real_uname);",
               "    struct utsname real_uname;\n    memset(&real_uname, 0, sizeof(real_uname));\n    uname(&real_uname);"),
              ("    strcpy(uts->hostname, hostname);",
               "    snprintf(uts->hostname, sizeof(uts->hostname), \"%s\",\n            hostname != NULL && hostname[0] != '\\0' ? hostname : \"ish\");"),
          ]
          for old, new in subs:
              if old not in s:
                  sys.exit("patch target not found, upstream changed: %r" % old)
              s = s.replace(old, new, 1)
          p.write_text(s)
          print("patched kernel/uname.c")
          PY
          sed -n '18,34p' kernel/uname.c

      - name: Build the CLI iSH (JIT, run-time translation)
        working-directory: src/deps/ish
        run: |
          meson setup build-arm64-jit \
            --buildtype=release \
            -Dlog="" \
            -Dkernel=ish \
            -Dengine=asbestos \
            -Dguest_arch=arm64 \
            -Djit=true \
            -Djit_emit=true
          ninja -C build-arm64-jit
          ls -lh build-arm64-jit/ish

      - name: Prepare the Alpine rootfs (realfs tree)
        working-directory: src
        run: |
          set -euo pipefail
          V=3.21.0
          URL="https://dl-cdn.alpinelinux.org/alpine/v3.21/releases/aarch64/alpine-minirootfs-$V-aarch64.tar.gz"
          R="deps/resources/alpine-realfs"
          rm -rf "$R"; mkdir -p "$R"
          curl -fsSL -o /tmp/rootfs.tar.gz "$URL"
          tar -xzf /tmp/rootfs.tar.gz -C "$R"
          # This must be a plain directory tree, not a fakefs: record.sh runs
          # `ish -r <rootfs>` and -r selects realfs (-f selects fakefs). A fakefs
          # dir handed to -r dies with "xX_main_Xx: No such file or directory".
          printf 'nameserver 8.8.8.8\nnameserver 8.4.4.4\n' > "$R/etc/resolv.conf"
          du -sh "$R"
          cat "$R/etc/alpine-release"
          "$PWD/deps/ish/build-arm64-jit/ish" -r "$PWD/$R" /bin/cat /etc/alpine-release

      - name: Print the recording abi
        working-directory: src
        run: |
          ISH="$PWD/deps/ish/build-arm64-jit/ish"
          R="$PWD/deps/resources/alpine-realfs"
          # Same PIC convention record.sh uses; a non-PIC build reports another abi.
          ABI=$(ISH_JIT_PIC=1 "$ISH" -r "$R" /bin/cat /proc/ish/jit | grep -o 'abi [0-9a-f]*' | cut -d' ' -f2)
          echo "recording abi: $ABI"
          echo "ABI=$ABI" >> "$GITHUB_ENV"
          if [ "$ABI" != "1f3bb5a0" ]; then
            echo "::warning::abi is $ABI, but Minis 1.15 expects 1f3bb5a0. Images will be rejected by the app."
          fi

      - name: Probe the Alpine archive for the versions the catalog pins
        run: |
          set +e
          ARCH="https://archive.alpinelinux.org/alpine/v3.21"
          miss=0
          for p in \
            main/aarch64/python3-3.12.15-r0.apk \
            main/aarch64/pcre2-10.43-r0.apk \
            main/aarch64/nodejs-22.23.2-r0.apk \
            main/aarch64/openssh-client-default-9.9_p2-r0.apk \
            main/aarch64/libssl3-3.3.2-r4.apk ; do
            code=$(curl -s -o /dev/null -m 12 -w "%{http_code}" -r 0-1023 "$ARCH/$p")
            echo "  $code  $p"
            [ "$code" = "206" ] || [ "$code" = "200" ] || miss=$((miss+1))
          done
          if [ "$miss" -eq 0 ]; then
            echo "ARCHIVE=yes" >> "$GITHUB_ENV"
            echo "archive usable: the 2026-10 package set is still fetchable"
          else
            echo "ARCHIVE=no" >> "$GITHUB_ENV"
            echo "archive unusable ($miss of 5 missing): will record against today's repo"
          fi

      - name: Install the guest packages
        working-directory: src
        run: |
          set -euo pipefail
          ISH="$PWD/deps/ish/build-arm64-jit/ish"
          R="$PWD/deps/resources/alpine-realfs"
          # apk add WITHOUT -u: keeps musl/busybox at the minirootfs versions
          # (1.2.5-r8 / 1.37.0-r8), which is exactly what the app's built-in
          # rootfs ships -- so those two images match by build-id, not just family.
          #
          # `openssl` (the CLI) is dropped on purpose: it depends on
          # libssl3=3.3.7-r2 and so upgrades libcrypto3/libssl3 away from the
          # 3.3.2-r4 the catalog was recorded against. deps/aot/tools/
          # record_local.sh states the same rule ("never install the openssl CLI
          # in the guest: it upgrades libcrypto3"). The TLS workloads drive
          # python3's ssl module, not the CLI, so nothing needs it.
          PKGS=$(python3 -c 'import json,os;d=json.load(open("deps/ish/benchmark/aojit/images.json"))["packages"]["apk"];m=os.environ["MODULES"].split();s={"openssl"};s.add("github-cli") if "gh" not in m else None;s.add("ripgrep") if "rg" not in m else None;print(" ".join(p for p in d if p not in s))')
          echo "apk add: $PKGS"
          if [ "${ARCHIVE:-no}" = "yes" ]; then
            # Point the guest at the archived v3.21 tree: every package then
            # resolves to the version the app's catalog was recorded against.
            printf '%s\n%s\n' \
              "https://archive.alpinelinux.org/alpine/v3.21/main" \
              "https://archive.alpinelinux.org/alpine/v3.21/community" > "$R/etc/apk/repositories"
            echo "repositories -> archive.alpinelinux.org (2026-10 snapshot)"
          fi
          set +e
          echo "--- guest uname (must not abort) ---"
          "$ISH" -r "$R" /bin/uname -a
          echo "guest uname exit=$?"
          set -e
          if ! "$ISH" -r "$R" /sbin/apk add $PKGS; then
            echo "::warning::install against the archive failed, falling back to today's repo"
            printf '%s\n%s\n' \
              "https://dl-cdn.alpinelinux.org/alpine/v3.21/main" \
              "https://dl-cdn.alpinelinux.org/alpine/v3.21/community" > "$R/etc/apk/repositories"
            "$ISH" -r "$R" /sbin/apk add $PKGS
          fi
          # The versions below decide which images match the catalog by build-id.
          "$ISH" -r "$R" /bin/sh -c 'for p in musl busybox zlib libcrypto3 libssl3 python3 nodejs sqlite-libs pcre2 py3-pillow libwebp libjpeg-turbo py3-numpy; do printf "%-16s %s\n" "$p" "$(apk info -e $p 2>/dev/null | head -1)"; done'
          "$ISH" -r "$R" /bin/sh -c 'musl=$(ls /lib/ld-musl-*.so.1); echo "musl: $musl"; /bin/busybox | head -1; python3 -V'
          if [ "${{ inputs.npm }}" = "true" ]; then
            NPM=$(python3 -c "import json;print(' '.join(json.load(open('deps/ish/benchmark/aojit/images.json'))['packages']['npm']))")
            "$ISH" -r "$R" /bin/sh -c "npm i -g --no-audit --no-fund $NPM"
          fi

      - name: Install the AOJIT workloads and generate inputs
        working-directory: src
        run: |
          ./deps/ish/benchmark/aojit/install.sh \
            "$PWD/deps/ish/build-arm64-jit/ish" \
            "$PWD/deps/resources/alpine-realfs"

      - name: Record the images
        working-directory: src
        run: |
          mkdir -p out
          ./deps/ish/benchmark/aojit/record_images.sh \
            "$PWD/deps/ish/build-arm64-jit/ish" \
            "$PWD/deps/resources/alpine-realfs" \
            "$PWD/out" $MODULES

      - name: Inspect the results
        working-directory: src
        run: |
          set +e
          ls -lh out
          echo "### image_info.py (one line per image)"
          python3 deps/aot/tools/image_info.py out | tee /tmp/images.txt
          python3 deps/aot/tools/image_info.py --json out > out/aot-manifest.json
          echo "### manifest"
          cat out/aot-manifest.json
          {
            echo "### AOJIT images for \`${{ inputs.ref }}\`"
            echo
            echo "- abi: \`${ABI}\` (Minis 1.15 expects \`1f3bb5a0\`)"
            echo "- ish submodule: \`$(git -C deps/ish rev-parse HEAD)\`"
            echo "- archive repo: \`${ARCHIVE:-no}\`"
            echo
            echo '```'
            cat /tmp/images.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload the manifest (a few KB, for the catalog patch)
        uses: actions/upload-artifact@v4
        with:
          name: aojit-manifest-${{ inputs.ref }}-run${{ github.run_number }}
          path: src/out/aot-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload the images
        uses: actions/upload-artifact@v4
        with:
          name: aojit-images-${{ inputs.ref }}-run${{ github.run_number }}
          path: |
            src/out/aot_*.S
            src/out/aot_*_ios.o
          if-no-files-found: error
          retention-days: 14
